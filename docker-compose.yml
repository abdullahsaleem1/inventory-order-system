version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./src:/app/src

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory_orders
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # --- added in later weeks ---
  # redis:        # Redis token-bucket rate limiter
  # rabbitmq:     # event-driven order processing pipeline
  # jaeger:       # OpenTelemetry trace visualization

volumes:
  pgdata:
