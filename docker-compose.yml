version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      BROKER_URL: amqp://guest:guest@rabbitmq:5672/
      READ_STORE_TYPE: elasticsearch
      READ_STORE_URL: http://elasticsearch:9200
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    volumes:
      - ./src:/app/src

  # Event consumer — the async side of order creation. Persists every
  # `order.created` event into Postgres (idempotent). Scale it out to see the
  # competing-consumer group in action: docker compose up --scale consumer=3
  consumer:
    build: .
    command: python -m scripts.consume_orders --group persistence
    env_file:
      - .env
    environment:
      BROKER_URL: amqp://guest:guest@rabbitmq:5672/
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/inventory_orders
      DEBUG: "false"
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    restart: unless-stopped

  # Async worker (Week 6) — a SEPARATE service that consumes `order.created`
  # events and asynchronously deducts inventory stock. Runs in its own
  # container alongside the API; retries failures with exponential backoff and
  # dead-letters poison/retry-exhausted messages to
  # orders.order-created.inventory.dlq. Scale out for more concurrent workers.
  worker:
    build: .
    command: python -m scripts.worker
    env_file:
      - .env
    environment:
      BROKER_URL: amqp://guest:guest@rabbitmq:5672/
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/inventory_orders
      DEBUG: "false"
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory_orders
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # RabbitMQ message broker + management UI — added Week 5.
  # AMQP: localhost:5672 | Management UI: http://localhost:15672 (guest/guest)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # --- CQRS dedicated read store (Week 8) ---
  # Elasticsearch holds ONE denormalized document per order. Query handlers
  # read EXCLUSIVELY from this store (never the write database); the read
  # projector worker below keeps it filled by consuming broker events.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # Sync worker (Week 8) — a SEPARATE service that consumes `order.created`
  # and `order.status.changed` events from the broker and upserts documents
  # into the Elasticsearch read store. Query endpoints become readable only
  # once this worker has projected the events (eventual consistency). It is
  # idempotent, so scale out safely: docker compose up --scale readprojector=2.
  readprojector:
    build: .
    command: python -m scripts.read_projector
    env_file:
      - .env
    environment:
      BROKER_URL: amqp://guest:guest@rabbitmq:5672/
      READ_STORE_TYPE: elasticsearch
      READ_STORE_URL: http://elasticsearch:9200
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/inventory_orders
      DEBUG: "false"
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    volumes:
      - ./src:/app/src
    restart: unless-stopped

  # Management UI for Postgres — added per Week 1 admin feedback.
  # Visit http://localhost:5050, log in with the credentials below, then add
  # a server manually: host=db, port=5432, user=postgres, password=postgres.
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # --- added in later weeks ---
  # redis:        # Redis token-bucket rate limiter
  # jaeger:       # OpenTelemetry trace visualization

volumes:
  pgdata:
  pgadmin_data:
  rabbitmq_data:
  esdata:
